<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia | Grupo Bellaforma</title>

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>
    <script src="js/bellaforma-ui.js" data-splash></script>

    <div class="registro-header">
        <div class="header-title">
            <img src="img/apple-touch-icon.png" alt="Grupo Bella Forma S.A.S." class="logo-marca-chica">
        </div>
        <div class="header-time" id="reloj">--:--:--</div>
    </div>

    <div class="container-registro">
        <div class="registro-card">
            <div class="card-header">
                <h2>Registrar Asistencia</h2>
                <p>Ingresa tu documento para continuar</p>
            </div>

            <div class="clock" id="clockBig">00:00:00</div>

            <!-- Formulario apuntando al archivo intermedio -->
            <form method="POST" action="registro_inicial.php" id="formAsistencia">
                <div class="form-group">
                    <label for="documento">Número de Documento <span class="form-required">*</span></label>
                    <input 
                        type="text" 
                        id="documento" 
                        name="documento" 
                        placeholder="Ej: 1234567890"
                        required
                        autocomplete="off"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <input type="hidden" id="dispositivo_id" name="dispositivo_id" value="">
                </div>

                <button type="submit" class="btn btn-primary" id="btnContinuar">Continuar</button>
                <a href="login.html" class="btn btn-back">← Volver al Inicio</a>
                <a href="registro_empleado.php" class="btn btn-secondary">Registrar por primera vez</a>
            </form>

            <div id="resultado"></div>
        </div>
    </div>

    <script>
        function obtenerIdDispositivo() {
            let id = localStorage.getItem('bellaforma_dispositivo_id');
            if (!id) {
                id = 'DISP-' + crypto.randomUUID();
                localStorage.setItem('bellaforma_dispositivo_id', id);
            }
            return id;
        }
        
        document.getElementById('dispositivo_id').value = obtenerIdDispositivo();

        // El reloj usa la hora del SERVIDOR (la misma que se guarda al registrar),
        // en zona America/Bogota, sin depender de la hora del celular.
        let desfaseServidor = 0;

        async function sincronizarHoraServidor() {
            try {
                const t0 = Date.now();
                const resp = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
                const t1 = Date.now();
                const fechaServidor = resp.headers.get('Date');
                if (fechaServidor) {
                    desfaseServidor = new Date(fechaServidor).getTime() - (t0 + t1) / 2;
                }
            } catch (e) { /* si falla, se usa la hora del dispositivo */ }
        }

        const formatoBogota = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'America/Bogota',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
        });

        function actualizarReloj() {
            const horaActualStr = formatoBogota.format(new Date(Date.now() + desfaseServidor));

            const elementoReloj = document.getElementById('reloj');
            if (elementoReloj) {
                elementoReloj.textContent = horaActualStr;
            }

            const elementoClockBig = document.getElementById('clockBig');
            if (elementoClockBig) {
                elementoClockBig.textContent = horaActualStr;
            }
        }

        sincronizarHoraServidor().then(actualizarReloj);
        setInterval(sincronizarHoraServidor, 300000);
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>
</body>

</html>
