<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia | Grupo Bellaforma</title>
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>

    <div class="registro-header">
        <div class="header-title">💅 Bellaforma</div>
        <div class="header-time" id="reloj">--:--:--</div>
    </div>

    <div class="container-registro">
        <div class="registro-card">
            <div class="card-header">
                <h2>Registrar Asistencia</h2>
                <p>Ingresa tu documento para continuar</p>
            </div>

            <div class="clock" id="clockBig">00:00:00</div>

            <!-- Formulario completo original apuntando al archivo intermedio -->
            <form method="POST" action="registro_inicial.php" id="formAsistencia">
                <div class="form-group">
                    <label for="documento">Número de Documento <span class="form-required">*</span></label>
                    <input 
                        type="text" 
                        id="documento" 
                        name="documento" 
                        placeholder="Ej: 1234567890"
                        required
                        autocomplete="off"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <input type="hidden" id="dispositivo_id" name="dispositivo_id" value="">
                </div>

                <button type="submit" class="btn btn-primary" id="btnContinuar">Continuar</button>
                <a href="login.html" class="btn btn-back">← Volver al Inicio</a>
                <a href="registro_empleado.php" class="btn btn-secondary">📝 Registrar por primera vez</a>
            </form>

            <div id="resultado"></div>
        </div>
    </div>

    <script>
        function obtenerIdDispositivo() {
            let id = localStorage.getItem('bellaforma_dispositivo_id');
            if (!id) {
                id = 'DISP-' + crypto.randomUUID();
                localStorage.setItem('bellaforma_dispositivo_id', id);
            }
            return id;
        }
        
        document.getElementById('dispositivo_id').value = obtenerIdDispositivo();

        function actualizarReloj() {
            const ahora = new Date();
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const segundos = String(ahora.getSeconds()).padStart(2, '0');
            
            const horaActualStr = `${horas}:${minutos}:${segundos}`;
            
            const elementoReloj = document.getElementById('reloj');
            if (elementoReloj) {
                elementoReloj.textContent = horaActualStr;
            }
            
            const elementoClockBig = document.getElementById('clockBig');
            if (elementoClockBig) {
                elementoClockBig.textContent = horaActualStr;
            }
        }
        
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>
</body>

</html>
