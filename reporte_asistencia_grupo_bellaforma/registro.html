<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia | Grupo Bellaforma</title>
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>

    <div class="registro-header">
        <div class="header-title">💅 Bellaforma</div>
        <div class="header-time" id="reloj">--:--:--</div>
    </div>

    <div class="container-registro">
        <div class="registro-card">
            <div class="card-header">
                <h2>Registrar Asistencia</h2>
                <p>Ingresa tu documento para continuar</p>
            </div>

            <div class="clock" id="clockBig">00:00:00</div>

            <!-- FORMULARIO APUNTANDO A registro.php -->
            <form method="POST" action="registro.php">
                
                <!-- Selector de Tipo (Entrada / Salida) necesario para el backend -->
                <div class="form-group">
                    <label for="tipo">Tipo de Registro <span class="form-required">*</span></label>
                    <select id="tipo" name="tipo" class="form-control" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 15px;">
                        <option value="entrada">Registrar Entrada</option>
                        <option value="salida">Registrar Salida</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="documento">Número de Documento <span class="form-required">*</span></label>
                    <input 
                        type="text" 
                        id="documento" 
                        name="documento" 
                        placeholder="Ej: 1234567890"
                        required
                        autocomplete="off"
                        autofocus
                    >
                </div>

                <!-- CAMPO DE JUSTIFICACIÓN (Obligatorio solo si llega tarde según el backend) -->
                <div class="form-group">
                    <label for="justificacion">Justificación de Retraso <span style="font-size: 0.85rem; color: #d9534f;">(Obligatorio solo si llega tarde)</span></label>
                    <textarea 
                        id="justificacion" 
                        name="justificacion" 
                        rows="2" 
                        placeholder="Escriba el motivo únicamente si llega tarde..."
                        style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; resize: vertical;"
                    ></textarea>
                </div>

                <div class="form-group">
                    <input type="hidden" id="dispositivo_id" name="dispositivo_id" value="">
                </div>

                <button type="submit" class="btn btn-primary">Continuar</button>
                <a href="login.html" class="btn btn-back">← Volver al Inicio</a>
                <a href="registro_empleado.php" class="btn btn-secondary">📝 Registrar por primera vez</a>
            </form>

            <div id="resultado"></div>
        </div>
    </div>

    <script>
        function obtenerIdDispositivo() {
            let id = localStorage.getItem('bellaforma_dispositivo_id');

            if (!id) {
                id = 'DISP-' + crypto.randomUUID();
                localStorage.setItem('bellaforma_dispositivo_id', id);
            }

            return id;
        }

        document.getElementById('dispositivo_id').value = obtenerIdDispositivo();

        function actualizarReloj() {
            const ahora = new Date();
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const segundos = String(ahora.getSeconds()).padStart(2, '0');
            
            const hora = `${horas}:${minutos}:${segundos}`;
            document.getElementById('reloj').textContent = hora;
            document.getElementById('clockBig').textContent = hora;
        }

        setInterval(actualizarReloj, 1000);
        actualizarReloj();
    </script>
</body>
</html>
