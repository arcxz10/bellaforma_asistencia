<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia | Grupo Bellaforma</title>
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>

    <div class="registro-header">
        <div class="header-title">💅 Bellaforma</div>
        <div class="header-time" id="reloj">--:--:--</div>
    </div>

    <div class="container-registro">
        <div class="registro-card">
            <div class="card-header">
                <h2>Registrar Asistencia</h2>
                <p>Ingresa tu documento para continuar</p>
            </div>

            <div class="clock" id="clockBig">00:00:00</div>

            <form method="POST" action="registro.php" id="formAsistencia">
                
                <div class="form-group">
                    <label for="documento">Número de Documento <span class="form-required">*</span></label>
                    <input 
                        type="text" 
                        id="documento" 
                        name="documento" 
                        placeholder="Ej: 1234567890"
                        required
                        autocomplete="off"
                        autofocus
                    >
                </div>

                <!-- CAMPO DE JUSTIFICACIÓN (Oculto por defecto, aparece solo si llega tarde) -->
                <div class="form-group" id="grupo-justificacion" style="display: none; margin-bottom: 15px;">
                    <label for="justificacion" style="color: #d9534f; font-weight: bold; font-size: 0.9rem;">
                        ⚠️ Has llegado tarde. Justificación obligatoria:
                    </label>
                    <textarea 
                        id="justificacion" 
                        name="justificacion" 
                        rows="2" 
                        placeholder="Escribe el motivo de tu retraso..."
                        style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #d9534f; font-family: inherit; resize: vertical;"
                    ></textarea>
                </div>

                <div class="form-group">
                    <input type="hidden" id="dispositivo_id" name="dispositivo_id" value="">
                </div>

                <button type="submit" class="btn btn-primary">Continuar</button>
                <a href="login.html" class="btn btn-back">← Volver al Inicio</a>
                <a href="registro_empleado.php" class="btn btn-secondary">📝 Registrar por primera vez</a>
            </form>

            <div id="resultado"></div>
        </div>
    </div>

    <script>
        function obtenerIdDispositivo() {
            let id = localStorage.getItem('bellaforma_dispositivo_id');
            if (!id) {
                id = 'DISP-' + crypto.randomUUID();
                localStorage.setItem('bellaforma_dispositivo_id', id);
            }
            return id;
        }
        document.getElementById('dispositivo_id').value = obtenerIdDispositivo();

        function actualizarReloj() {
            const ahora = new Date();
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const segundos = String(ahora.getSeconds()).padStart(2, '0');
            document.getElementById('reloj').textContent = `${horas}:${minutos}:${segundos}`;
            document.getElementById('clockBig').textContent = `${horas}:${minutos}:${segundos}`;
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        const inputDocumento = document.getElementById('documento');
        const grupoJustificacion = document.getElementById('grupo-justificacion');
        const inputJustificacion = document.getElementById('justificacion');
        const formAsistencia = document.getElementById('formAsistencia');

        // Verificar al salir del campo del documento
        async function verificarRetraso() {
            const documento = inputDocumento.value.trim();
            if (documento.length >= 5) {
                try {
                    const respuesta = await fetch(`verificar_estado.php?documento=${documento}`);
                    const datos = await respuesta.json();

                    if (datos.tarde) {
                        grupoJustificacion.style.display = 'block';
                        inputJustificacion.setAttribute('required', 'true');
                    } else {
                        grupoJustificacion.style.display = 'none';
                        inputJustificacion.removeAttribute('required');
                    }
                } catch (e) {
                    console.error("Error al verificar estado", e);
                }
            } else {
                grupoJustificacion.style.display = 'none';
                inputJustificacion.removeAttribute('required');
            }
        }

        inputDocumento.addEventListener('blur', verificarRetraso);

        // Interceptar el envío del formulario para asegurar que si llega tarde y no ha justificado, se detenga y lo obligue a escribir
        formAsistencia.addEventListener('submit', async function(e) {
            const documento = inputDocumento.value.trim();
            
            // Si la caja de justificación ya está visible y está vacía, evitamos que se envíe de una
            if (grupoJustificacion.style.display === 'block' && inputJustificacion.value.trim() === '') {
                e.preventDefault(); // Detiene el envío
                inputJustificacion.focus(); // Manda el cursor a la caja de justificación para que escriba
                alert('⚠️ Has llegado tarde. Por favor escribe una justificación antes de continuar.');
                return;
            }

            // Opcional: una última comprobación rápida por AJAX antes de enviar por si no hizo blur
            if (documento.length >= 5 && grupoJustificacion.style.display === 'none') {
                try {
                    const respuesta = await fetch(`verificar_estado.php?documento=${documento}`);
                    const datos = await respuesta.json();

                    if (datos.tarde && inputJustificacion.value.trim() === '') {
                        e.preventDefault(); // Detiene el envío
                        grupoJustificacion.style.display = 'block';
                        inputJustificacion.setAttribute('required', 'true');
                        inputJustificacion.focus(); // Pone el cursor en la justificación
                        alert('⚠️ Has llegado tarde. Por favor escribe una justificación para continuar.');
                    }
                } catch (err) {
                    // Si falla la red, dejamos que PHP en el backend haga la validación final
                }
            }
        });
    </script>
</body>
</html>
