<head>

    </div>



    <!-- CONTENEDOR PRINCIPAL -->

    <div class="container-registro">

        <!-- CARD DE REGISTRO -->

        <div class="registro-card">

            <div class="card-header">

                <h2>Registrar Asistencia</h2>

                <p>Ingresa tu documento para continuar</p>

            </div>



            <!-- RELOJ DIGITAL -->

            <div class="clock" id="clockBig">00:00:00</div>



            <!-- FORMULARIO -->

            <form method="POST" action="registro_inicial.php">

                <div class="form-group">

                    <label for="documento">Número de Documento <span class="form-required">*</span></label>

                    <input 

                        type="text" 

                        id="documento" 

                        name="documento" 

                        placeholder="Ej: 1234567890"

                        required

                        autofocus

                    >

                </div>



                <!-- CAMPO DE JUSTIFICACIÓN DE RETRASO -->

                <div class="form-group">

                    <label for="justificacion">Justificación de Retraso <span style="font-size: 0.85rem; color: #666;">(Opcional, solo si aplica)</span></label>

                    <textarea 

                        id="justificacion" 

                        name="justificacion" 

                        rows="2" 

                        placeholder="Escriba el motivo si llegó tarde..."

                        style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; resize: vertical;"

                    ></textarea>

                </div>



                <div class="form-group">

                    <input type="hidden" id="dispositivo_id" name="dispositivo_id" value="">

                </div>



                <button type="submit" class="btn btn-primary">Continuar</button>

                <a href="login.html" class="btn btn-back">← Volver al Inicio</a>

                <a href="registro_empleado.php" class="btn btn-secondary">📝 Registrar por primera vez</a>

            </form>



            <!-- RESULTADO (si hay respuesta) -->

            <div id="resultado"></div>

        </div>

    </div>



    <script>

        // ID DE DISPOSITIVO: se genera una sola vez por navegador/tablet

        // y se reutiliza siempre. Así evitamos que alguien digite

        // manualmente el ID de otro dispositivo para marcar por otra persona.

        function obtenerIdDispositivo() {

            let id = localStorage.getItem('bellaforma_dispositivo_id');



            if (!id) {

                id = 'DISP-' + crypto.randomUUID();

                localStorage.setItem('bellaforma_dispositivo_id', id);

            }



            return id;

        }



        document.getElementById('dispositivo_id').value = obtenerIdDispositivo();

            const minutos = String(ahora.getMinutes()).padStart(2, '0');

            const hora = `${horas}:${minutos}:${segundos}`;

            document.getElementById('reloj').textContent = hora;

            document.getElementById('clockBig').textContent = hora;

        }



        setInterval(actualizarReloj, 1000);

        actualizarReloj();

    </script>

</body>

</html>
