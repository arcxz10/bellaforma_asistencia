<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Acceso administrativo | Grupo Bellaforma
    </title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>

    <div class="container-login">

        <div class="form-container">

            <div class="header-login">

                <h1>
                    🏢 BELLAFORMA
                </h1>

                <p>
                    Sistema de Asistencia y Control
                </p>

            </div>


            <div class="login-card">

                <h2>
                    Acceso administrativo
                </h2>

                <p class="login-description">
                    Ingrese sus credenciales para acceder al panel administrativo.
                </p>


                <div
                    id="mensaje-error"
                    class="mensaje-error"
                    style="display: none;"
                ></div>


                <form
                    method="POST"
                    action="login.php"
                    class="form-login"
                >

                    <input
                        type="hidden"
                        name="tipo"
                        value="admin"
                    >


                    <div class="form-group">

                        <label for="usuario">
                            👤 Usuario
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingrese su usuario"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            🔒 Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingrese su contraseña"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-submit"
                    >
                        Iniciar sesión
                    </button>

                </form>


                <div class="registro-asistencia">

                    <p>
                        ¿Desea registrar su asistencia?
                    </p>

                    <a
                        href="registro.html"
                        class="btn-asistencia"
                    >
                        Registrar asistencia
                    </a>

                </div>


                <a
                    href="index.html"
                    class="volver"
                >
                    ← Volver al inicio
                </a>

            </div>

        </div>

    </div>

</body>

</html>
